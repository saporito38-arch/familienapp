<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5FA">
<title>Familie</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#1E2433; --muted:#667085; --line:#E3E7EF; --soft:#EBEEF5;
  --mario:#3D7BE0; --nadine:#E0457B; --lina:#8B67E8; --emilio:#F2A900; --family:#12A37A;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151F; --surface:#1A202C; --ink:#ECEFF5; --muted:#9AA3B5; --line:#2A3242; --soft:#232A38; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11151F; --surface:#1A202C; --ink:#ECEFF5; --muted:#9AA3B5; --line:#2A3242; --soft:#232A38; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Avenir Next",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2{line-height:1.15;margin:0;font-weight:800}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mario);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:14px 18px 130px}
.wrap.chatmode{padding-bottom:170px}
body:not(.authed) .wrap, body:not(.authed) .tabs, body:not(.authed) .fab, body:not(.authed) .composer{display:none!important}
body.authed #login{display:none}

/* Login */
#login{min-height:100%;display:grid;place-items:center;padding:24px 18px}
.lcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:var(--shadow)}
.lcard .logo{width:56px;height:56px;border-radius:16px;background:var(--family);display:grid;place-items:center;margin-bottom:16px}
.lcard h1{font-size:28px;margin-bottom:4px}
.lcard p{color:var(--muted);margin:0 0 20px;font-weight:600}
.lcard .btn{width:100%;margin-top:4px}
.lcard .note{margin-top:16px}

/* Kopf */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:10px 0 22px}
.top h1{font-size:clamp(28px,7vw,34px);letter-spacing:-.01em}
.top .sub{color:var(--muted);font-weight:600;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.offline{font-size:12px;font-weight:800;color:var(--nadine);background:color-mix(in srgb,var(--nadine) 12%,transparent);padding:2px 9px;border-radius:999px}
.me{width:42px;height:42px;flex:none;border-radius:50%;border:0;padding:0;overflow:hidden;background:var(--c);color:var(--fg);font-weight:800;font-size:18px;cursor:pointer}
.av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}

/* Familie */
.family{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.bubble{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.face{position:relative;width:clamp(52px,15vw,62px);aspect-ratio:1;border-radius:50%;background:var(--c);color:var(--fg);display:grid;place-items:center;font-weight:800;font-size:22px;transition:opacity .15s}
.bubble[aria-pressed="true"] .face{outline:3px solid var(--c);outline-offset:3px}
.bubble.dim .face{opacity:.3}
.nm{font-weight:700;font-size:14px}
.count{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center}
.filterhint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-weight:600;margin:0 0 20px;font-size:14px}
.linkbtn{background:none;border:0;padding:0;font-weight:700;color:var(--family);cursor:pointer}

/* Abschnitte */
.sec{margin:0 0 28px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.sec h2{font-size:19px}

/* Termine */
.ev{display:flex;gap:14px;align-items:stretch;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.bar{width:4px;flex:none;border-radius:2px}
.time{min-width:58px;font-weight:800;font-size:15px}
.time small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.body{display:flex;flex-direction:column;gap:5px;min-width:0}
.title{font-weight:700;overflow-wrap:anywhere}
.who{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.ev.small{padding:9px 12px;box-shadow:none}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-weight:600}
.empty .btn{margin-top:10px}

/* Vorschauen */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600}
.preview{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.preview .from{display:block;font-size:13px;font-weight:800;color:var(--c)}
.preview .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Buttons */
.btn{font-weight:700;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--family);border-color:var(--family);color:#fff}
.btn.danger{background:transparent;color:var(--nadine);border-color:color-mix(in srgb,var(--nadine) 40%,transparent)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.fab{position:fixed;right:max(18px,calc(50vw - 302px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--family);color:#fff;border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--family) 35%,transparent);cursor:pointer;z-index:9;display:grid;place-items:center}
.fab[hidden]{display:none}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:4px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--soft)}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Kalender */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav .lbl{text-align:center;font-weight:700}
.weeknav .lbl small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.day .wd{font-size:12px;font-weight:700;color:var(--muted)}
.day .num{font-weight:800;font-size:19px;line-height:1.2}
.day.today .num{color:var(--family)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] .wd,.day[aria-pressed="true"].today .num{color:var(--bg)}
.dots{display:flex;gap:3px;height:7px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font-weight:700;font-size:15px;cursor:pointer}
.pchip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.pchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--fg)}
.pchip[aria-pressed="true"]::before{background:var(--fg)}
.kfilter{margin-bottom:20px}

/* Einkauf */
.add{display:flex;gap:8px;margin-bottom:18px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],textarea{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--family)}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;margin-bottom:6px}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--c);background:transparent;color:#fff;font-weight:800;font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0}
.item.done .check{background:var(--c)}
.item .txt{flex:1;font-weight:700;overflow-wrap:anywhere}
.item .by{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.item.done .txt span:first-child{text-decoration:line-through;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}

/* Chat */
.chat{display:flex;flex-direction:column}
.msg{max-width:80%;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-start;margin-top:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.first{margin-top:12px}
.msg .from{font-size:13px;font-weight:800;color:var(--c);margin:0 0 2px 12px}
.mb{background:var(--surface);border:1px solid var(--line);padding:8px 13px;border-radius:18px 18px 18px 6px;overflow-wrap:anywhere;white-space:pre-wrap}
.mine .mb{background:var(--c);color:var(--fg);border-color:var(--c);border-radius:18px 18px 6px 18px}
.msg .ts{font-size:11px;font-weight:600;color:var(--muted);margin:2px 8px 0}
.daysep{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:3px 12px;border-radius:999px;margin:18px 0 4px}
.composer{position:fixed;left:0;right:0;z-index:9;background:var(--bg);padding:8px 12px;border-top:1px solid var(--line)}
.composer[hidden]{display:none}
.composer .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{resize:none;max-height:120px;border-radius:20px;padding:9px 14px}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--family);color:#fff;cursor:pointer;display:grid;place-items:center}
.send svg{width:22px;height:22px}

/* Dialoge */
dialog{border:0;border-radius:20px;padding:0;background:var(--surface);color:var(--ink);width:min(540px,calc(100vw - 24px));max-height:calc(100% - 40px);box-shadow:0 20px 50px rgba(16,24,40,.25)}
dialog::backdrop{background:rgba(16,20,32,.45)}
.dlg{padding:20px}
.dlg h2{font-size:22px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;flex:1;min-width:0}
.field>span{font-weight:700;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:14px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--family)}
.err{color:var(--nadine);font-weight:700;min-height:1.4em;margin:0 0 8px;font-size:15px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.melist{display:grid;gap:8px;margin-bottom:12px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);flex-wrap:wrap}
.prow.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.prow .mini{width:48px;height:48px;flex:none;border-radius:50%;overflow:hidden;background:var(--c);color:var(--fg);display:grid;place-items:center;font-weight:800;font-size:20px}
.prow .pinfo{flex:1;min-width:110px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.prow .pname{font-weight:800}
.prow .pacts{display:flex;gap:6px;align-items:center}
.upl{position:relative;display:inline-block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.linkbtn.small{font-size:13px;color:var(--muted)}
.note{color:var(--muted);font-size:14px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <form class="lcard" id="loginForm" novalidate>
    <div class="logo"><svg class="i" width="30" height="30" viewBox="0 0 24 24" style="stroke:#fff;stroke-width:2"><path d="M4 11l8-6.5 8 6.5M6 9.5V19h12V9.5"/><path d="M10 19v-5h4v5"/></svg></div>
    <h1>Familie</h1>
    <p>Melde dich mit deinem Familienkonto an.</p>
    <label class="field"><span>E-Mail</span><input type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="off"></label>
    <label class="field"><span>Passwort</span><input type="password" name="password" autocomplete="current-password"></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button type="submit" class="btn primary" id="loginBtn">Anmelden</button>
    <p class="note">Passwort vergessen? Mario kann es im Supabase-Dashboard neu setzen.</p>
  </form>
</section>

<div class="wrap" id="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>

<button class="fab" id="fab" aria-label="Termin eintragen"><svg class="i" width="26" height="26" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="composer" id="composer" hidden>
  <div class="in">
    <textarea id="msgIn" rows="1" maxlength="1000" placeholder="Nachricht an die Familie" aria-label="Nachricht"></textarea>
    <button class="send" id="sendBtn" aria-label="Nachricht senden"><svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg></button>
  </div>
</div>

<nav class="tabs" id="tabs" aria-label="Bereiche">
  <button data-tab="heute"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>Heute</button>
  <button data-tab="kalender"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kalender</button>
  <button data-tab="einkauf"><svg class="i" viewBox="0 0 24 24"><path d="M3 4h2l2.3 10.8a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 1.9-1.5L20.5 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Einkauf</button>
  <button data-tab="chat"><svg class="i" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1.1-4.3A8.5 8.5 0 1 1 20.5 12z"/></svg>Chat</button>
</nav>

<dialog id="evDlg">
  <form class="dlg" id="evForm" novalidate>
    <h2 id="evDlgTitle">Termin eintragen</h2>
    <label class="field"><span>Was steht an?</span><input type="text" name="title" maxlength="80" placeholder="z. B. Schwimmkurs" autocomplete="off"></label>
    <label class="field"><span>Datum</span><input type="date" name="date"></label>
    <label class="toggle"><input type="checkbox" name="allDay"> Ganztägig</label>
    <div class="row" id="times">
      <label class="field"><span>Von</span><input type="time" name="start"></label>
      <label class="field"><span>Bis</span><input type="time" name="end"></label>
    </div>
    <div class="field"><span>Für wen?</span><div class="pick" id="pick"></div></div>
    <label class="field"><span>Notiz</span><textarea name="note" rows="2" maxlength="300" placeholder="Optional"></textarea></label>
    <p class="err" id="evErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="evDelete">Termin löschen</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="evCancel">Abbrechen</button>
      <button type="submit" class="btn primary">Termin speichern</button>
    </div>
  </form>
</dialog>

<dialog id="meDlg">
  <div class="dlg">
    <h2>Profile</h2>
    <div class="melist" id="melist"></div>
    <p class="note">Profilfotos sind für die ganze Familie sichtbar. Für Emilio könnt ihr ebenfalls ein Foto festlegen.</p>
    <div class="actions">
      <button type="button" class="btn danger" id="logoutBtn">Abmelden</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="meClose">Fertig</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Verbindung zu Supabase ===== */
const SUPABASE_URL='https://ldejccrshbzvkpfokhjx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkZWpjY3JzaGJ6dmtwZm9raGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NTkwMDgsImV4cCI6MjEwNzIzNTAwOH0.DXIbbUfRu7UKvlK9fqNMllrSirClKtOPodUWkal9yCs';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ===== Hilfsfunktionen ===== */
const COLORS={mario:'var(--mario)',nadine:'var(--nadine)',lina:'var(--lina)',emilio:'var(--emilio)'};
const FG={emilio:'#1E2433'};
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const CACHE='familienapp-cache-v1';

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startOfWeek=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const newId=()=>(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtLong=d=>`${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`;
const hm=ts=>{const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
function kw(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function dayLabel(k){const t=ymd(new Date()),y=ymd(addDays(new Date(),-1));return k===t?'Heute':k===y?'Gestern':fmtLong(parse(k))}

/* ===== Zustand ===== */
let session=null, PEOPLE=[], P={}, membersRaw=[];
const S={me:null,familyId:null,events:[],items:[],msgs:[]};
const ui={view:'heute',filter:null,sel:ymd(new Date()),week:startOfWeek(new Date())};
let live=false, channel=null;
const $=id=>document.getElementById(id);
const per=id=>P[id]||{id,name:'?',c:'var(--muted)',fg:'#fff',photo:''};
const pv=id=>`--c:${per(id).c};--fg:${per(id).fg}`;
const av=id=>per(id).photo?`<img class="av" src="${esc(per(id).photo)}" alt="">`:esc(per(id).name[0]);

const mapEv=r=>({id:r.id,title:r.title,date:r.date,allDay:r.all_day,start:r.start_time||'',end:r.end_time||'',people:r.people||[],note:r.note||''});
const mapItem=r=>({id:r.id,text:r.text,done:r.done,by:r.added_by,ts:Date.parse(r.created_at)||Date.now()});
const mapMsg=r=>({id:r.id,by:r.sender,text:r.body,ts:Date.parse(r.created_at)||Date.now()});
function setMembers(rows){
  membersRaw=rows;
  PEOPLE=[...rows].sort((a,b)=>a.sort-b.sort).map(r=>({id:r.slug,dbId:r.id,name:r.name,c:COLORS[r.color]||'var(--family)',fg:FG[r.color]||'#fff',login:!!r.user_id,photo:r.photo||''}));
  P=Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
}
function cache(){
  try{localStorage.setItem(CACHE,JSON.stringify({userId:session&&session.user.id,members:membersRaw,me:S.me,familyId:S.familyId,events:S.events,items:S.items,msgs:S.msgs}))}catch(e){}
}
function readCache(){try{return JSON.parse(localStorage.getItem(CACHE))}catch(e){return null}}

/* ===== Laden & Live-Sync ===== */
async function loadAll(){
  const {data:mem,error}=await sb.from('members').select('*').order('sort');
  if(error) throw error;
  const mine=mem.find(m=>m.user_id===session.user.id);
  if(!mine) throw new Error('nofamily');
  S.familyId=mine.family_id; S.me=mine.slug; setMembers(mem);
  const [ev,it,ms]=await Promise.all([
    sb.from('events').select('*').order('date'),
    sb.from('items').select('*').order('created_at',{ascending:false}),
    sb.from('messages').select('*').order('created_at',{ascending:false}).limit(300)
  ]);
  for(const r of [ev,it,ms]) if(r.error) throw r.error;
  S.events=ev.data.map(mapEv); S.items=it.data.map(mapItem); S.msgs=ms.data.map(mapMsg);
  cache();
}
function upsert(arr,kind,row,map){
  if(kind==='del') return arr.filter(x=>x.id!==row.id);
  const o=map(row), i=arr.findIndex(x=>x.id===o.id);
  if(i>=0){const c=[...arr];c[i]=o;return c}
  return [...arr,o];
}
let rt=null;
function softRender(){clearTimeout(rt);rt=setTimeout(()=>{cache();render()},60)}
function subscribe(){
  if(channel) sb.removeChannel(channel);
  const filter=`family_id=eq.${S.familyId}`;
  channel=sb.channel('familie-'+S.familyId);
  const on=(table,fn)=>{
    channel.on('postgres_changes',{event:'INSERT',schema:'public',table,filter},p=>{fn('up',p.new);softRender()});
    channel.on('postgres_changes',{event:'UPDATE',schema:'public',table,filter},p=>{fn('up',p.new);softRender()});
    channel.on('postgres_changes',{event:'DELETE',schema:'public',table},p=>{fn('del',p.old);softRender()});
  };
  on('events',(k,r)=>{S.events=upsert(S.events,k,r,mapEv)});
  on('items',(k,r)=>{S.items=upsert(S.items,k,r,mapItem)});
  on('messages',(k,r)=>{S.msgs=upsert(S.msgs,k,r,mapMsg)});
  on('members',(k,r)=>{if(k==='up'){setMembers(membersRaw.map(m=>m.id===r.id?r:m));if($('meDlg').open)renderMeList()}});
  channel.subscribe(status=>{const was=live;live=status==='SUBSCRIBED';if(was!==live)header()});
}
async function refresh(){
  try{await loadAll();render();if(!live)subscribe()}catch(e){console.error(e)}
}
async function write(q,undo){
  const {error}=await q;
  if(error){console.error(error);toast('Konnte nicht gespeichert werden. Bitte Verbindung prüfen.');if(undo){undo();render()}else refresh()}
}

/* ===== Darstellung ===== */
const sortEv=(a,b)=>(b.allDay-a.allDay)||a.start.localeCompare(b.start)||a.title.localeCompare(b.title);
const eventsOn=date=>S.events.filter(e=>e.date===date&&(!ui.filter||e.people.includes(ui.filter))).sort(sortEv);
function tags(people){
  if(PEOPLE.length&&people.length===PEOPLE.length) return `<span class="tag" style="--c:var(--family)">Alle</span>`;
  return people.map(id=>`<span class="tag" style="${pv(id)}">${esc(per(id).name)}</span>`).join('');
}
function stripe(people){
  const n=people.length||1;
  return `linear-gradient(180deg,${people.map((id,i)=>`${per(id).c} ${i*100/n}% ${(i+1)*100/n}%`).join(',')||'var(--muted),var(--muted)'})`;
}
function evCard(e,small){
  const time=e.allDay?'Ganztägig':`${esc(e.start)}${e.end?`<small>bis ${esc(e.end)}</small>`:''}`;
  return `<button class="ev${small?' small':''}" data-ev="${e.id}">
    <span class="bar" style="background:${stripe(e.people)}"></span>
    <span class="time">${time}</span>
    <span class="body"><span class="title">${esc(e.title)}</span><span class="who">${tags(e.people)}</span></span>
  </button>`;
}
function header(){
  if(!S.me) return;
  const me=per(S.me);
  let h='',sub='';
  if(ui.view==='heute'){h='Heute';sub=fmtLong(new Date());}
  if(ui.view==='kalender'){const m=addDays(ui.week,3);h='Kalender';sub=`${MON[m.getMonth()]} ${m.getFullYear()}`;}
  if(ui.view==='einkauf'){const n=S.items.filter(i=>!i.done).length;h='Einkaufsliste';sub=n?`${n} ${n===1?'Sache':'Sachen'} offen`:'Alles erledigt';}
  if(ui.view==='chat'){const names=PEOPLE.filter(p=>p.login).map(p=>p.name);h='Familienchat';sub=names.length>1?names.slice(0,-1).join(', ')+' und '+names.at(-1):names.join('');}
  $('top').innerHTML=`<div><h1>${h}</h1><div class="sub"><span>${esc(sub)}</span>${live?'':'<span class="offline">Nicht verbunden</span>'}</div></div>
    <button class="me" id="meBtn" style="${pv(me.id)}" aria-label="Angemeldet als ${esc(me.name)}. Profile öffnen">${av(me.id)}</button>`;
}
function viewHeute(){
  const today=ymd(new Date()), tomorrow=ymd(addDays(new Date(),1));
  const fam=PEOPLE.map(p=>{
    const n=S.events.filter(e=>e.date===today&&e.people.includes(p.id)).length;
    const cls=ui.filter&&ui.filter!==p.id?'bubble dim':'bubble';
    return `<button class="${cls}" data-filter="${p.id}" aria-pressed="${ui.filter===p.id}" style="${pv(p.id)}">
      <span class="face">${av(p.id)}${n?`<span class="count" aria-label="${n} Termine heute">${n}</span>`:''}</span>
      <span class="nm">${esc(p.name)}</span></button>`;
  }).join('');
  const hint=ui.filter?`<p class="filterhint">Nur Termine von ${esc(per(ui.filter).name)}. <button class="linkbtn" data-filter="">Alle zeigen</button></p>`:`<p class="filterhint">Tippe auf eine Person, um nur ihre Termine zu sehen.</p>`;
  const tEv=eventsOn(today), mEv=eventsOn(tomorrow);
  const open=S.items.filter(i=>!i.done).sort((a,b)=>b.ts-a.ts);
  const last=[...S.msgs].sort((a,b)=>a.ts-b.ts).pop();
  return `<div class="family">${fam}</div>${hint}
  <section class="sec">
    <div class="sec-head"><h2>Termine heute</h2></div>
    ${tEv.length?tEv.map(e=>evCard(e)).join(''):`<div class="empty">Heute steht nichts an.<br><button class="btn primary" data-new-ev>Termin eintragen</button></div>`}
  </section>
  ${mEv.length?`<section class="sec"><div class="sec-head"><h2>Morgen</h2></div>${mEv.map(e=>evCard(e,true)).join('')}</section>`:''}
  <section class="sec">
    <div class="sec-head"><h2>Einkaufsliste</h2><button class="linkbtn" data-tab="einkauf">Zur Liste</button></div>
    ${open.length?`<div class="chips">${open.slice(0,8).map(i=>`<span class="chip">${esc(i.text)}</span>`).join('')}${open.length>8?`<span class="chip">+${open.length-8}</span>`:''}</div>`:`<div class="empty">Nichts zu kaufen.</div>`}
  </section>
  ${last?`<section class="sec"><div class="sec-head"><h2>Letzte Nachricht</h2><button class="linkbtn" data-tab="chat">Zum Chat</button></div>
    <button class="preview" data-tab="chat" style="${pv(last.by)}"><span class="from">${esc(per(last.by).name)}, ${hm(last.ts)}</span><span class="txt">${esc(last.text)}</span></button></section>`:''}`;
}
function viewKalender(){
  const s=ui.week, e=addDays(s,6), today=ymd(new Date());
  const lbl=`${s.getDate()}. ${s.getMonth()!==e.getMonth()?MON[s.getMonth()]+' ':''}bis ${e.getDate()}. ${MON[e.getMonth()]}`;
  const order=id=>PEOPLE.findIndex(p=>p.id===id);
  const days=[...Array(7)].map((_,i)=>{
    const d=addDays(s,i), k=ymd(d);
    const who=[...new Set(eventsOn(k).flatMap(x=>x.people))].sort((a,b)=>order(a)-order(b));
    return `<button class="day${k===today?' today':''}" data-day="${k}" aria-pressed="${k===ui.sel}" aria-label="${fmtLong(d)}">
      <span class="wd">${WDS[i]}</span><span class="num">${d.getDate()}</span>
      <span class="dots">${who.map(id=>`<span class="dot" style="${pv(id)}"></span>`).join('')}</span></button>`;
  }).join('');
  const filt=`<button class="pchip" data-filter="" aria-pressed="${!ui.filter}" style="--c:var(--family);--fg:#fff">Alle</button>`+
    PEOPLE.map(p=>`<button class="pchip" data-filter="${p.id}" aria-pressed="${ui.filter===p.id}" style="${pv(p.id)}">${esc(p.name)}</button>`).join('');
  const list=eventsOn(ui.sel);
  return `<div class="weeknav">
      <button class="round" data-week="-1" aria-label="Vorherige Woche">‹</button>
      <div class="lbl">${lbl}<small>KW ${kw(s)} <button class="linkbtn" data-week="0">Heute</button></small></div>
      <button class="round" data-week="1" aria-label="Nächste Woche">›</button>
    </div>
    <div class="week">${days}</div>
    <div class="pick kfilter">${filt}</div>
    <section class="sec">
      <div class="sec-head"><h2>${fmtLong(parse(ui.sel))}</h2></div>
      ${list.length?list.map(x=>evCard(x)).join(''):`<div class="empty">Keine Termine an diesem Tag.<br><button class="btn primary" data-new-ev>Termin eintragen</button></div>`}
    </section>`;
}
function viewEinkauf(){
  const open=S.items.filter(i=>!i.done).sort((a,b)=>b.ts-a.ts), done=S.items.filter(i=>i.done).sort((a,b)=>b.ts-a.ts);
  const row=i=>`<div class="item${i.done?' done':''}">
      <button class="check" data-check="${i.id}" style="${pv(i.by)}" aria-label="${esc(i.text)} ${i.done?'wieder offen':'abhaken'}">${i.done?'✓':''}</button>
      <span class="txt"><span>${esc(i.text)}</span><span class="by">von ${esc(per(i.by).name)}</span></span>
      <button class="del" data-del="${i.id}" aria-label="${esc(i.text)} löschen">×</button></div>`;
  return `<div class="add">
      <input type="text" id="newItem" placeholder="Was fehlt? Mehrere mit Komma" autocomplete="off" enterkeyhint="done">
      <button class="btn primary" id="addItem">Hinzufügen</button></div>
    <section class="sec">${open.length?open.map(row).join(''):`<div class="empty">Die Liste ist leer. Schreib oben rein, was fehlt.</div>`}</section>
    ${done.length?`<section class="sec"><div class="sec-head"><h2>Im Wagen</h2><button class="linkbtn" data-clear>Erledigte entfernen</button></div>${done.map(row).join('')}</section>`:''}`;
}
function viewChat(){
  const msgs=[...S.msgs].sort((a,b)=>a.ts-b.ts);
  if(!msgs.length) return `<div class="empty">Noch keine Nachrichten. Schreib unten die erste.</div>`;
  let out='', lastDay='', lastBy='';
  for(const m of msgs){
    const k=ymd(new Date(m.ts));
    if(k!==lastDay){out+=`<div class="daysep">${dayLabel(k)}</div>`;lastDay=k;lastBy='';}
    const mine=m.by===S.me, first=m.by!==lastBy;
    out+=`<div class="msg${mine?' mine':''}${first?' first':''}" style="${pv(m.by)}">
      ${first&&!mine?`<span class="from">${esc(per(m.by).name)}</span>`:''}
      <div class="mb">${esc(m.text)}</div><span class="ts">${hm(m.ts)}</span></div>`;
    lastBy=m.by;
  }
  return `<div class="chat">${out}</div>`;
}
function render(opts={}){
  if(!S.me) return;
  const v=ui.view;
  const ni=$('newItem'), keep=ni?{v:ni.value,f:document.activeElement===ni}:null;
  const nearBottom=window.innerHeight+window.scrollY>=document.body.scrollHeight-160;
  header();
  $('view').innerHTML=v==='heute'?viewHeute():v==='kalender'?viewKalender():v==='einkauf'?viewEinkauf():viewChat();
  document.querySelectorAll('.tabs [data-tab]').forEach(b=>{if(b.dataset.tab===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('fab').hidden=v==='einkauf'||v==='chat';
  $('composer').hidden=v!=='chat';
  $('wrap').classList.toggle('chatmode',v==='chat');
  if(keep){const n=$('newItem');if(n){n.value=keep.v;if(keep.f)n.focus()}}
  if(v==='chat'){$('composer').style.bottom=$('tabs').offsetHeight+'px';if(opts.toBottom||nearBottom)window.scrollTo(0,document.body.scrollHeight)}
}
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* ===== Einkauf ===== */
function addItems(){
  const inp=$('newItem'); if(!inp) return;
  const parts=inp.value.split(',').map(x=>x.trim()).filter(Boolean).map(t=>t.slice(0,60));
  if(!parts.length){inp.focus();return}
  const now=Date.now();
  const rows=parts.map((t,i)=>({id:newId(),family_id:S.familyId,text:t,done:false,added_by:S.me}));
  rows.forEach((r,i)=>S.items.push({id:r.id,text:r.text,done:false,by:S.me,ts:now+i}));
  inp.value=''; render(); $('newItem').focus();
  toast(parts.length===1?`${parts[0]} hinzugefügt`:`${parts.length} Sachen hinzugefügt`);
  const ids=rows.map(r=>r.id);
  write(sb.from('items').insert(rows),()=>{S.items=S.items.filter(x=>!ids.includes(x.id))});
}

/* ===== Chat ===== */
const msgIn=$('msgIn');
function autosize(){msgIn.style.height='auto';msgIn.style.height=Math.min(msgIn.scrollHeight,120)+'px'}
msgIn.addEventListener('input',autosize);
function sendMsg(){
  const text=msgIn.value.trim(); if(!text){msgIn.focus();return}
  const id=newId();
  S.msgs.push({id,by:S.me,text,ts:Date.now()});
  msgIn.value=''; autosize(); render({toBottom:true}); msgIn.focus();
  write(sb.from('messages').insert({id,family_id:S.familyId,sender:S.me,body:text}),()=>{S.msgs=S.msgs.filter(m=>m.id!==id);msgIn.value=text});
}
$('sendBtn').onclick=sendMsg;
msgIn.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();sendMsg()}});
window.addEventListener('resize',()=>{if(ui.view==='chat')$('composer').style.bottom=$('tabs').offsetHeight+'px'});

/* ===== Termin-Dialog ===== */
const dlg=$('evDlg'), f=$('evForm');
let editing=null, picked=new Set();
function renderPick(){
  const all=picked.size===PEOPLE.length;
  $('pick').innerHTML=`<button type="button" class="pchip" data-pick="all" aria-pressed="${all}" style="--c:var(--family);--fg:#fff">Alle</button>`+
    PEOPLE.map(p=>`<button type="button" class="pchip" data-pick="${p.id}" aria-pressed="${picked.has(p.id)}" style="${pv(p.id)}">${esc(p.name)}</button>`).join('');
}
function syncTimes(){$('times').style.display=f.allDay.checked?'none':'flex'}
function openEvent(id){
  const e=id?S.events.find(x=>x.id===id):null;
  editing=e?e.id:null;
  $('evDlgTitle').textContent=e?'Termin bearbeiten':'Termin eintragen';
  f.title.value=e?e.title:'';
  f.date.value=e?e.date:(ui.view==='kalender'?ui.sel:ymd(new Date()));
  f.allDay.checked=e?e.allDay:false;
  f.start.value=e?e.start:''; f.end.value=e?e.end:''; f.note.value=e?e.note:'';
  picked=new Set(e?e.people:[ui.filter||S.me]);
  $('evErr').textContent=''; $('evDelete').hidden=!e;
  renderPick(); syncTimes(); dlg.showModal();
}
f.allDay.addEventListener('change',syncTimes);
$('pick').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-pick]'); if(!b) return;
  const k=b.dataset.pick;
  if(k==='all') picked=picked.size===PEOPLE.length?new Set():new Set(PEOPLE.map(p=>p.id));
  else picked.has(k)?picked.delete(k):picked.add(k);
  renderPick();
});
f.addEventListener('submit',ev=>{
  ev.preventDefault();
  const title=f.title.value.trim(), date=f.date.value, allDay=f.allDay.checked, start=f.start.value, end=f.end.value;
  const err=m=>{$('evErr').textContent=m};
  if(!title) return err('Gib dem Termin einen Namen.');
  if(!date) return err('Wähle ein Datum.');
  if(!allDay&&!start) return err('Trag eine Startzeit ein oder wähle ganztägig.');
  if(!allDay&&end&&end<start) return err('Das Ende liegt vor dem Start.');
  if(!picked.size) return err('Wähle mindestens eine Person.');
  const people=PEOPLE.map(p=>p.id).filter(id=>picked.has(id));
  const data={title,date,allDay,start:allDay?'':start,end:allDay?'':end,people,note:f.note.value.trim()};
  const row={title,date,all_day:allDay,start_time:data.start,end_time:data.end,people,note:data.note};
  if(editing){
    const id=editing, before={...S.events.find(x=>x.id===id)};
    Object.assign(S.events.find(x=>x.id===id),data);
    write(sb.from('events').update(row).eq('id',id),()=>{Object.assign(S.events.find(x=>x.id===id)||{},before)});
  }else{
    const id=newId();
    S.events.push({id,...data});
    write(sb.from('events').insert({id,family_id:S.familyId,...row}),()=>{S.events=S.events.filter(x=>x.id!==id)});
  }
  dlg.close(); ui.sel=date; ui.week=startOfWeek(parse(date)); render(); toast('Termin gespeichert');
});
$('evCancel').onclick=()=>dlg.close();
$('evDelete').onclick=()=>{
  if(!editing||!confirm('Diesen Termin wirklich löschen?')) return;
  const id=editing, old=S.events.find(x=>x.id===id);
  S.events=S.events.filter(x=>x.id!==id); dlg.close(); render(); toast('Termin gelöscht');
  write(sb.from('events').delete().eq('id',id),()=>{if(old)S.events.push(old)});
};

const meDlg=$('meDlg');
function renderMeList(){
  $('melist').innerHTML=PEOPLE.map(p=>`<div class="prow${S.me===p.id?' active':''}" style="${pv(p.id)}">
    <span class="mini">${av(p.id)}</span>
    <span class="pinfo"><span class="pname">${esc(p.name)}${S.me===p.id?' (du)':''}</span>${p.photo?`<button type="button" class="linkbtn small" data-unphoto="${p.id}">Foto entfernen</button>`:''}</span>
    <span class="pacts"><label class="btn sm upl">${p.photo?'Foto ändern':'Foto wählen'}<input class="vh" type="file" accept="image/*" data-photo="${p.id}"></label></span></div>`).join('');
}
function openMe(){renderMeList();meDlg.showModal()}
function setPhoto(slug,photo){
  const p=P[slug]; if(!p) return;
  const old=p.photo; p.photo=photo;
  membersRaw=membersRaw.map(m=>m.id===p.dbId?{...m,photo}:m);
  renderMeList(); render();
  write(sb.from('members').update({photo:photo||null}).eq('id',p.dbId),()=>{p.photo=old;membersRaw=membersRaw.map(m=>m.id===p.dbId?{...m,photo:old}:m);renderMeList()});
}
function loadPhoto(file,slug){
  const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{
    const s=Math.min(img.naturalWidth,img.naturalHeight), c=document.createElement('canvas');
    c.width=c.height=192;
    c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,192,192);
    URL.revokeObjectURL(url); setPhoto(slug,c.toDataURL('image/jpeg',0.82)); toast('Foto gespeichert');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Das Bild konnte nicht geladen werden')};
  img.src=url;
}
$('melist').addEventListener('change',ev=>{
  const inp=ev.target.closest('[data-photo]'); if(!inp||!inp.files[0]) return;
  loadPhoto(inp.files[0],inp.dataset.photo); inp.value='';
});
$('melist').addEventListener('click',ev=>{
  const u=ev.target.closest('[data-unphoto]');
  if(u){setPhoto(u.dataset.unphoto,'');toast('Foto entfernt')}
});
$('meClose').onclick=()=>meDlg.close();
$('logoutBtn').onclick=async()=>{
  if(!confirm('Wirklich abmelden?')) return;
  try{await sb.auth.signOut()}catch(e){}
  try{localStorage.removeItem(CACHE)}catch(e){}
  location.reload();
};

/* ===== Klicks ===== */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button'); if(!t||t.closest('dialog')||t.closest('.composer')||t.closest('#login')) return;
  const d=t.dataset;
  if(d.tab){ui.view=d.tab;window.scrollTo(0,0);render({toBottom:true});return}
  if('filter' in d){ui.filter=d.filter&&ui.filter!==d.filter?d.filter:null;render();return}
  if(d.ev){openEvent(d.ev);return}
  if('newEv' in d||t.id==='fab'){openEvent(null);return}
  if(d.day){ui.sel=d.day;render();return}
  if('week' in d){
    const n=Number(d.week);
    if(n===0){ui.week=startOfWeek(new Date());ui.sel=ymd(new Date())}
    else{ui.week=addDays(ui.week,7*n);ui.sel=ymd(ui.week)}
    render();return;
  }
  if(d.check){
    const i=S.items.find(x=>x.id===d.check); if(!i) return;
    i.done=!i.done; render();
    write(sb.from('items').update({done:i.done}).eq('id',i.id),()=>{i.done=!i.done});
    return;
  }
  if(d.del){
    const old=S.items.find(x=>x.id===d.del);
    S.items=S.items.filter(x=>x.id!==d.del); render();
    write(sb.from('items').delete().eq('id',d.del),()=>{if(old)S.items.push(old)});
    return;
  }
  if('clear' in d){
    const ids=S.items.filter(x=>x.done).map(x=>x.id), old=S.items;
    S.items=S.items.filter(x=>!x.done); render(); toast('Erledigte entfernt');
    write(sb.from('items').delete().in('id',ids),()=>{S.items=old});
    return;
  }
  if(t.id==='addItem'){addItems();return}
  if(t.id==='meBtn'){openMe();return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newItem'&&!ev.isComposing){ev.preventDefault();addItems()}});

/* ===== Anmeldung & Start ===== */
function showLogin(msg){
  document.body.classList.remove('authed');
  $('loginErr').textContent=msg||'';
}
$('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const email=ev.target.email.value.trim(), password=ev.target.password.value;
  if(!email||!password){$('loginErr').textContent='Bitte E-Mail und Passwort eingeben.';return}
  $('loginBtn').disabled=true; $('loginErr').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  $('loginBtn').disabled=false;
  if(error){$('loginErr').textContent=error.status===400?'E-Mail oder Passwort stimmt nicht.':'Anmeldung fehlgeschlagen. Bitte Verbindung prüfen.';return}
  session=data.session; ev.target.password.value='';
  startApp();
});
async function startApp(){
  const c=readCache();
  if(c&&c.userId===session.user.id&&c.familyId){
    setMembers(c.members||[]); S.me=c.me; S.familyId=c.familyId;
    S.events=c.events||[]; S.items=c.items||[]; S.msgs=c.msgs||[];
    document.body.classList.add('authed'); render();
  }
  try{
    await loadAll();
    document.body.classList.add('authed'); render(); subscribe();
  }catch(e){
    console.error(e);
    if(e.message==='nofamily'){await sb.auth.signOut();showLogin('Dieses Konto ist noch keiner Familie zugeordnet.');return}
    if(!S.familyId){showLogin('Keine Verbindung zum Server. Bitte später erneut versuchen.');return}
    toast('Offline: Du siehst die zuletzt geladenen Daten.');
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&S.familyId)refresh()});
window.addEventListener('online',()=>{if(session&&S.familyId)refresh()});
sb.auth.onAuthStateChange((evt,s)=>{if(evt==='SIGNED_OUT'){session=null}else if(s){session=s}});

(async()=>{
  const {data}=await sb.auth.getSession();
  session=data.session;
  if(session) startApp(); else showLogin();
})();
</script>
